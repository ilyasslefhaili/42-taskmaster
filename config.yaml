programs:
  sleeper:
    cmd: "/bin/sleep 1000"
    numprocs: 1
    umask: 022
    workingdir: /tmp
    autostart: true
    autorestart: unexpected
    exitcodes:
      - 0
      - 2
    startretries: 3
    starttime: 5
    stopsignal: TERM
    stoptime: 10
    stdout: /tmp/sleeper.stdout
    stderr: /tmp/sleeper.stderr
    env:
      STARTED_BY: taskmaster
      ANSWER: 42

  ticker:
    cmd: "/bin/sh -c 'while true; do echo tick; sleep 1; done'"
    numprocs: 2
    umask: 077
    workingdir: /tmp
    autostart: true
    autorestart: unexpected
    exitcodes: 0
    startretries: 3
    starttime: 5
    stopsignal: USR1
    stoptime: 10
    stdout: /tmp/ticker.stdout
    stderr: /tmp/ticker.stderr
